  reasoning: >-
    This paper presents "The Miniscope Box," an open-source operant chamber specifically
    designed and optimized for long-term miniscope in vivo calcium imaging in rats. The
    entire paper is a methods contribution built around miniscope use, addressing challenges
    such as cable management with commutators, GRIN lens protection, long-term housing to
    reduce miniscope damage, and synchronization of miniscope neural recordings with behavioral
    data via MedPC. The paper cites the MiniLFOV seed paper (Guo et al., Sci. Adv. 2023)
    among its references. While it does not specify "UCLA Miniscope v4" by name, the paper
    uses "miniscope" generically throughout, references the UCLA Miniscope ecosystem papers
    (Ghosh et al., Guo et al.), and the operant box is designed for the open-source miniscope
    form factor. This is a clear methods paper that develops complementary hardware for
    miniscope-based experiments.
