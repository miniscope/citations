  reasoning: This is a detailed methods/protocol paper published in Current Protocols
    that provides step-by-step instructions for miniscope calcium imaging in freely
    behaving rats, including surgery, lens implantation, recording, and analysis.
    It uses a custom miniscope based on open-source UCLA Miniscope designs (Giovanni
    Barbera's miniscope_v2.0 repository), explicitly references the UCLA Miniscope
    baseplate from LABmaker, discusses compatibility with the UCLA Miniscope (MiniLFOV),
    and cites the MiniLFOV seed paper (Guo et al.). The paper is strongly related
    as a methods protocol for the miniscope ecosystem.
