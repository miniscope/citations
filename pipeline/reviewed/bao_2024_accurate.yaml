  reasoning: >-
    This paper develops SUNS2-ANE, a neuron segmentation pipeline for one-photon
    calcium imaging videos from microendoscopes. It cites Minian (ref 35) as a
    peer one-photon segmentation algorithm in the introduction, describing its
    background removal approach. However, Minian is NOT directly benchmarked
    against -- the actual comparisons are with MIN1PIPE, CNMF-E, EXTRACT, and
    DeepWonder. The paper is relevant as a software tool in the same ecosystem
    that processes the same type of data produced by Miniscopes, and it
    acknowledges Minian as a related tool. Confidence is moderate because the
    connection is indirect -- Minian is cited only in passing as related work,
    not used or tested against directly.
