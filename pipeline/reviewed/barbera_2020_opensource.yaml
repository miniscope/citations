  reasoning: >-
    This paper develops an open-source capacitive touch sensing device for automated
    detection of social behavior. The device directly integrates with the Miniscope
    DAQ/FPGA hardware platform -- the custom PCB developed for the Miniscope is used
    as the data acquisition and synchronization interface for the capacitive sensors.
    The paper cites the Cai et al. 2016 seed paper and explicitly references the
    Miniscope GRIN lens/DAQ system (ref [16]). This represents a meaningful hardware
    extension that builds on the Miniscope DAQ platform for behavioral measurement,
    not merely a passing citation.
