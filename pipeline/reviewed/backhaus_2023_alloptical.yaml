  reasoning: >-
    This is a methods/review chapter in the Neuromethods book series on all-optical
    methods to study neuronal function. It explicitly discusses the UCLA Miniscope
    and Miniscope-v4 by name, citing their technical specifications (60 Hz, 752x480
    pixel FOV) and identifying them as open-source miniature microscope systems. The
    paper reviews the all-optical physiology pipeline including one-photon miniature
    microscopes with GRIN lenses, and positions the UCLA Miniscope as a key tool in
    this landscape. While the paper does not use the Miniscope for original research,
    it serves as a review/methods reference that describes the tool and its capabilities
    in detail. Confidence is 0.82 rather than higher because the paper covers a broad
    range of optical methods and the Miniscope discussion is one component of the
    larger chapter.
