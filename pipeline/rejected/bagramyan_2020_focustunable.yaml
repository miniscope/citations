  reasoning: >-
    This paper presents an independent miniaturized 1-photon microscope with a
    focus-tunable liquid crystal lens, built at Université Laval (Galstian lab).
    It is NOT a UCLA Miniscope and does not use, extend, or build upon any UCLA
    Miniscope tool. The seed paper (Cai et al. 2016) is cited purely as a
    benchmark comparison for depth scanning capability, and the Aharoni and
    Hoogland 2019 review is cited for general context about miniaturized
    microscopes. The paper uses Min1pipe (not Minian) for data analysis. This
    is a competing/alternative miniature microscope design with no tool
    connection to the UCLA Miniscope project.
