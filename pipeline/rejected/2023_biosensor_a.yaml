  reasoning: 'Full-text analysis of Russian-language biosensor paper. The paper develops
    a biosensor system based on optical imaging of odor-evoked glomerular activity
    patterns in the olfactory bulb. In its conclusion/discussion, it explicitly proposes
    using a "miniscope with a large field of view" (минископа с большим полем зрения)
    citing reference [67] (Guo et al. 2023, the MiniLFOV seed paper) as a future
    direction to make the biosensor system portable for freely moving rodents. While
    the paper does not use the MiniLFOV in its current experiments, it identifies
    the MiniLFOV as a key enabling technology for the next stage of their biosensor
    system development. This constitutes a meaningful tool connection beyond mere
    scientific context citation.'
