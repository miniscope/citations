  reasoning: This paper studies hippocampal theta-gamma coupling and spike-field coherence
    after traumatic brain injury using high-density laminar electrophysiology in rats.
    It cites Shuman et al. 2020 (seed paper) purely for scientific context regarding
    similar electrophysiological deficits in epilepsy, with no connection to Miniscope
    tools. Full-text analysis confirms the methodology is entirely electrode-based
    (laminar probes, spike sorting, LFP analysis). No tool from the Miniscope family
    is mentioned anywhere in the paper.
