  reasoning: This paper from the Ryan lab studies how retroactive interference adaptively
    modulates engram expression. The Ryan lab's standard methodology involves engram
    labeling via activity-dependent transgenic systems (cFos-tTA), optogenetic/chemogenetic
    reactivation, and immunohistochemistry -- not miniature microscope calcium imaging.
    The paper almost certainly cites Cai et al. 2016 for its conceptual contribution
    to memory linking (temporal proximity causing engram overlap), not for the UCLA
    Miniscope hardware described in that paper. No full text was available for direct
    tool mention search, but the strong negative signal from the lab's known methodology
    and the paper's topic supports rejection. No mentions of miniscope, miniature
    microscope, calcium imaging, or any related tool could be found.
