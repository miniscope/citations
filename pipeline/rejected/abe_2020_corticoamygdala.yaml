  reasoning: This paper studies conditioned taste aversion (CTA) memory retrieval
    in mice, examining cortico-amygdala interactions that determine which insular
    cortical neurons participate in taste memory. Methods include c-Fos
    immunohistochemistry, electrophysiology, and chemogenetic (DREADD) manipulation
    of basolateral amygdala activity. No miniature microscope, calcium imaging, or
    in vivo fluorescence imaging is used. The citation to Cai et al. 2016 (seed
    paper) references memory allocation/engram concepts, not the UCLA Miniscope
    tool. Full text search of companion .txt file (note - PMC fetch returned wrong
    document, a Cochrane COVID-19 review sharing the same PMCID PMC7389386) found
    zero mentions of miniscope, miniature microscope, open-source miniscope, calcium
    imaging, MiniLFOV, MiniXL, Minian, 2P Miniscope, or Miniscope DAQ. BibTeX from
    Crossref is valid. Confidence 0.95 - paper clearly uses non-Miniscope methods;
    small residual uncertainty due to corrupted full text, but paper title, journal,
    abstract, and known methodology all confirm no tool connection.
