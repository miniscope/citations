  reasoning: Full text review confirms this is a high-density laminar electrophysiology
    study of hippocampal theta-gamma coupling after traumatic brain injury in rats.
    The methods describe multi-shank laminar electrodes implanted in CA1, with signals
    sampled at 30 kHz and wirelessly transmitted. No mention of Miniscope, miniature
    microscope, calcium imaging, GCaMP, GRIN lens, or any related imaging tool anywhere
    in the full text. The Shuman et al. 2019 seed paper appears only as reference 139
    in the bibliography, cited for scientific context about hippocampal oscillatory
    dynamics in disease models, with no connection to Miniscope tools.
