  reasoning: >-
    This paper presents a new miniature fluorescence microscope with a variable focus
    liquid lens for multi-plane imaging. It does not directly use the UCLA Miniscope
    or MiniLFOV tools, but explicitly references and compares against them. The paper
    cites Guo et al. (Miniscope-LFOV) as reference 15 and Aharoni & Hoogland 2019
    as reference 4, and directly names "the UCLA miniscope" when comparing ETL weight.
    The paper is related as a competing/complementary miniature microscope design
    that positions itself relative to the UCLA Miniscope ecosystem. Confidence is
    moderate (0.75) because while it substantively references and compares against
    the tools, it does not actually use them -- it builds its own independent system.
