  reasoning: >-
    Paper uses transgenic mice (activity-dependent genetic tagging), DREADDs
    chemogenetics, and chronic social defeat stress behavioral paradigms to study
    early-life stress neuronal ensembles in NAc and mPFC. No calcium imaging,
    miniscopes, or any related imaging tools are used. The citation to seed paper
    Cai et al. 2016 is for the scientific concept of shared neuronal ensembles
    encoding contextual memories, not for the UCLA Miniscope tool. Full text was
    not available for review but the abstract and methods description confirm
    purely molecular/behavioral approaches (TRAP transgenic labeling, hM4Di
    DREADDs, immunohistochemistry, behavioral testing).
