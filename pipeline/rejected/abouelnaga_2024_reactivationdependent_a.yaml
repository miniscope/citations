  reasoning: Full-text review confirms this is a behavioral pharmacology study using
    contextual fear conditioning and intrahippocampal drug infusions (pirenzepine, an
    M1 muscarinic antagonist) in male rats. The paper cites the seed paper (Cai et al.
    2016) purely for its scientific findings on memory linking, not for Miniscope
    technology. A thorough search of the full text found zero mentions of any Miniscope
    tools (UCLA Miniscope v4, MiniLFOV, MiniXL, Minian, 2P Miniscope, Miniscope DAQ),
    calcium imaging, GCaMP, fluorescence imaging, GRIN lenses, or miniature microscopes.
    The only analysis tool used was ezTrack for scoring freezing behavior. Methods
    consist entirely of behavioral testing and pharmacological manipulation with no
    neural imaging component.
